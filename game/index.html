<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#112f35">
  <meta name="description" content="Solmar Bay: Hot Streets. An original offline canvas open-world crime game.">
  <link rel="icon" href="data:,">
  <title>Solmar Bay: Hot Streets</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#112f35;color:#fff1d5;font-family:Arial,sans-serif}
    #game{display:block;width:100%;height:100%;outline:0;touch-action:none;cursor:crosshair}
    .accessible{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
  </style>
</head>
<body>
  <canvas id="game" tabindex="0" aria-label="Solmar Bay: Hot Streets. Enter to begin, C to continue. WASD or arrows to move, E to enter or exit a car, F to interact, mouse to aim and attack, 1 fists, 2 pistol, R reload, Escape pause, Tab city map."></canvas>
  <p class="accessible">Play as Mara Cruz in an original coastal city. Help Inez save Tideway Garage across six story missions or take dispatch jobs with J. Shift to sprint. Space is handbrake while driving. M toggles audio. P or Escape pauses; save from the pause menu.</p>
  <p id="status" class="accessible" role="status" aria-live="polite"></p>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
